<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchoolManager</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --text: #ffffff;
      --muted: #8e8e93;
      --accent: #0A84FF;
      --input-bg: #2c2c2e;
      --border: #3a3a3c;
      --warning: #FF9F0A;
      --pos: #30D158;
      --neg: #FF453A;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 15px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 980px; margin: 0 auto; }

    .nav {
      display: flex;
      gap: 8px;
      background: var(--card);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid var(--border);
      margin-bottom: 14px;
    }
    .nav button {
      flex: 1;
      padding: 10px 8px;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .nav button.active {
      background: var(--accent);
      color: #fff;
    }

    .card {
      background: var(--card);
      padding: 20px;
      border-radius: 15px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.45);
    }
    .narrow { max-width: 480px; margin: 0 auto; }
    h2 { margin: 0 0 8px; font-size: 18px; text-align: center; }

    label {
      display: block;
      margin-top: 12px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      letter-spacing: 0.4px;
    }
    select, input[type="text"], input[type="date"] {
      width: 100%;
      margin-top: 5px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 15px;
    }

    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .sym-btn {
      flex: 0 0 46px;
      margin-top: 5px;
      padding: 10px;
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      cursor: pointer;
    }
    .quick-btn {
      flex: 1;
      min-width: 105px;
      margin-top: 5px;
      padding: 10px 8px;
      border-radius: 8px;
      border: 1px solid var(--warning);
      background: transparent;
      color: var(--warning);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }
    .quick-btn.pos-btn {
      border-color: var(--pos);
      color: var(--pos);
    }
    .quick-btn:active { opacity: 0.75; }

    .mode-switch {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .mode-btn {
      flex: 1;
      padding: 9px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--muted);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
    }
    .mode-btn.active {
      border-color: var(--accent);
      background: rgba(10, 132, 255, 0.18);
      color: #fff;
    }

    .primary-btn {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }
    .primary-btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .status {
      margin-top: 14px;
      min-height: 20px;
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: var(--pos);
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }

    .table-wrap {
      margin-top: 12px;
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      white-space: nowrap;
    }
    th:first-child, td:first-child {
      text-align: left;
      position: sticky;
      left: 0;
      background: var(--card);
      z-index: 1;
    }
    th { background: #262629; color: #d1d1d6; font-size: 12px; }
    th:first-child { background: #262629; z-index: 2; }
    tr.footer-row td {
      background: #24211a;
      color: var(--warning);
      font-style: italic;
      font-weight: 700;
    }
    tr.footer-row td:first-child { background: #24211a; }

    .cell-inp {
      margin-top: 0 !important;
      padding: 8px !important;
      font-size: 13px !important;
      min-width: 95px;
    }
    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      background: var(--input-bg);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="nav">
      <button id="tab-singolo" class="active" onclick="showTab('singolo')">A-Classi</button>
      <button id="tab-verifica" onclick="showTab('verifica')">Caricamento Verifica</button>
      <button id="tab-prospetto" onclick="showTab('prospetto')">Prospetto</button>
    </div>

    <!-- 1. A-CLASSI (INSERIMENTO SINGOLO: O VOTO O ANNOTAZIONE +-0.25) -->
    <div id="view-singolo" class="card narrow">
      <h2>A-Classi</h2>

      <label>Classe</label>
      <select id="s-classe" onchange="loadAlunni('s-classe', 's-alunno', 's-status')">
        <option value="">-- Seleziona classe --</option>
        <option value="3AM">3AM</option>
        <option value="4AM">4AM</option>
        <option value="5AM">5AM</option>
      </select>

      <label>Alunno</label>
      <select id="s-alunno">
        <option value="">Scegli classe...</option>
      </select>

      <label>Materia</label>
      <select id="s-materia" onchange="renderQuickButtons()">
        <option value="TECNOLOGIA">TECNOLOGIA</option>
        <option value="SISTEMI">SISTEMI</option>
        <option value="DISEGNO">DISEGNO</option>
      </select>

      <label>Tipo inserimento</label>
      <div class="mode-switch">
        <button type="button" id="mode-voto" class="mode-btn active" onclick="setModoSingolo('voto')">Voto (es. 7+)</button>
        <button type="button" id="mode-ann" class="mode-btn" onclick="setModoSingolo('ann')">Annotazione (±0.25)</button>
      </div>

      <div id="box-voto">
        <label>Voto</label>
        <div class="row">
          <input type="text" id="s-voto" placeholder="Es: 8, 7+, 6-" style="flex:1;">
          <button type="button" class="sym-btn" style="background:var(--pos);" onclick="appendSym('+')">+</button>
          <button type="button" class="sym-btn" style="background:var(--neg);" onclick="appendSym('-')">-</button>
        </div>
      </div>

      <div id="box-ann" class="hidden">
        <label>Valore annotazione</label>
        <select id="s-ann-punti" onchange="toggleDescNegativa()">
          <option value="0.25">+0.25 (Positiva)</option>
          <option value="-0.25">-0.25 (Negativa)</option>
        </select>

        <div id="box-desc-neg" class="hidden">
          <label>Descrizione annotazione negativa</label>
          <input type="text" id="s-desc-neg" placeholder="Obbligatoria per -0.25 (es. No DPI)">
        </div>
      </div>

      <label id="quick-label">Pulsanti rapidi</label>
      <div id="quick-btns" class="row"></div>

      <button id="s-btn" class="primary-btn" onclick="saveSingolo()">REGISTRA DATO</button>
      <div id="s-status" class="status"></div>
    </div>

    <!-- 2. CARICAMENTO VERIFICA (GRIGLIA MULTI-STUDENTE) -->
    <div id="view-verifica" class="card hidden">
      <h2>Caricamento Verifica</h2>

      <div class="meta-grid">
        <div>
          <label>Classe</label>
          <select id="v-classe" onchange="loadVerificaGrid()">
            <option value="">-- Seleziona classe --</option>
            <option value="3AM">3AM</option>
            <option value="4AM">4AM</option>
            <option value="5AM">5AM</option>
          </select>
        </div>

        <div>
          <label>Data comune</label>
          <input type="date" id="v-data">
        </div>

        <div>
          <label>Materia</label>
          <select id="v-materia">
            <option value="TECNOLOGIA">TECNOLOGIA</option>
            <option value="SISTEMI">SISTEMI</option>
            <option value="DISEGNO">DISEGNO</option>
          </select>
        </div>

        <div>
          <label>Argomento comune</label>
          <input type="text" id="v-argomento" placeholder="Es: Fresatrice, PLC, Quotatura">
        </div>
      </div>

      <div id="v-grid-wrap" class="table-wrap hidden">
        <table>
          <thead>
            <tr>
              <th>Alunno</th>
              <th>Voto (es. 7+)</th>
              <th>Annotazione (±0.25)</th>
              <th>Desc. se -0.25</th>
            </tr>
          </thead>
          <tbody id="v-tbody"></tbody>
        </table>
      </div>

      <button id="v-btn" class="primary-btn hidden" onclick="saveVerificaGrid()">SALVA GRIGLIA VERIFICA</button>
      <div id="v-status" class="status"></div>
    </div>

    <!-- 3. PROSPETTO IN SOLA LETTURA (UNA CLASSE ALLA VOLTA) -->
    <div id="view-prospetto" class="card hidden">
      <h2>Prospetto Classe</h2>
      <div style="text-align:center;"><span class="pill">SOLA LETTURA</span></div>

      <label>Seleziona classe (una alla volta)</label>
      <select id="p-classe" onchange="loadProspetto()">
        <option value="">-- Seleziona 3AM, 4AM o 5AM --</option>
        <option value="3AM">3AM</option>
        <option value="4AM">4AM</option>
        <option value="5AM">5AM</option>
      </select>

      <div id="p-status" class="status"></div>
      <div id="p-wrap" class="table-wrap hidden">
        <table id="p-table"></table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://dgdlldmskwkgummpdgnx.supabase.co";
    // Qui va inserita la chiave PUBBLICA (anon / publishable), NON la chiave segreta (sb_secret_...)
    const SUPABASE_ANON_KEY = "sb_publishable_Yv8ob9MdEaYb9fcsavar8Q_nCLc0HX0";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const QUICK_BY_MATERIA = {
      TECNOLOGIA: [
        { label: "⚠️ NO DPI (-0.25)", mode: "ann", punti: "-0.25", desc: "No DPI" },
        { label: "⚙️ PARAMETRI (-0.25)", mode: "ann", punti: "-0.25", desc: "Errati Parametri" },
        { label: "🧹 NO PULIZIA (-0.25)", mode: "ann", punti: "-0.25", desc: "No Pulizia" },
        { label: "➕ ATTREZZATURA (+0.25)", mode: "ann", punti: "0.25", desc: "" }
      ],
      SISTEMI: [
        { label: "⚡ ERRORE CABLAGGIO (-0.25)", mode: "ann", punti: "-0.25", desc: "Errore Cablaggio" },
        { label: "➕ ANALISI OK (+0.25)", mode: "ann", punti: "0.25", desc: "" }
      ],
      DISEGNO: [
        { label: "✏️ TRATTO/QUOTE (-0.25)", mode: "ann", punti: "-0.25", desc: "Tratto/Quote" },
        { label: "➕ TAVOLA CURATA (+0.25)", mode: "ann", punti: "0.25", desc: "" }
      ]
    };

    let modoSingolo = "voto";
    let annoAttivoCache = null;

    window.addEventListener("DOMContentLoaded", () => {
      renderQuickButtons();
      toggleDescNegativa();
      const oggi = new Date();
      const yyyy = oggi.getFullYear();
      const mm = String(oggi.getMonth() + 1).padStart(2, "0");
      const dd = String(oggi.getDate()).padStart(2, "0");
      document.getElementById("v-data").value = `${yyyy}-${mm}-${dd}`;
    });

    function showTab(tab) {
      ["singolo", "verifica", "prospetto"].forEach(t => {
        document.getElementById("view-" + t).classList.toggle("hidden", t !== tab);
        document.getElementById("tab-" + t).classList.toggle("active", t === tab);
      });
    }

    function setModoSingolo(modo) {
      modoSingolo = modo;
      document.getElementById("mode-voto").classList.toggle("active", modo === "voto");
      document.getElementById("mode-ann").classList.toggle("active", modo === "ann");
      document.getElementById("box-voto").classList.toggle("hidden", modo !== "voto");
      document.getElementById("box-ann").classList.toggle("hidden", modo !== "ann");
    }

    function toggleDescNegativa() {
      const punti = document.getElementById("s-ann-punti").value;
      document.getElementById("box-desc-neg").classList.toggle("hidden", punti !== "-0.25");
    }

    function appendSym(s) {
      const el = document.getElementById("s-voto");
      el.value += s;
      el.focus();
    }

    function renderQuickButtons() {
      const mat = document.getElementById("s-materia").value;
      const items = QUICK_BY_MATERIA[mat] || [];
      document.getElementById("quick-label").innerText = `Pulsanti rapidi ${mat}`;
      document.getElementById("quick-btns").innerHTML = items.map((it, i) => {
        const extraCls = it.punti === "0.25" ? " pos-btn" : "";
        return `<button type="button" class="quick-btn${extraCls}" onclick="applyQuick(${i})">${it.label}</button>`;
      }).join("");
    }

    function applyQuick(index) {
      const mat = document.getElementById("s-materia").value;
      const it = (QUICK_BY_MATERIA[mat] || [])[index];
      if (!it) return;
      setModoSingolo(it.mode);
      document.getElementById("s-ann-punti").value = it.punti;
      document.getElementById("s-desc-neg").value = it.desc || "";
      toggleDescNegativa();
    }

    async function getAnnoAttivo() {
      if (annoAttivoCache) return annoAttivoCache;
      const { data, error } = await sb
        .from("anni_scolastici")
        .select("id, etichetta")
        .eq("attivo", true)
        .single();
      if (error) throw new Error("Anno scolastico attivo non trovato: " + error.message);
      annoAttivoCache = data;
      return data;
    }

    async function getClasseAnnoId(codiceClasse) {
      const anno = await getAnnoAttivo();
      const { data, error } = await sb
        .from("classi_anno")
        .select("id")
        .eq("anno_id", anno.id)
        .eq("codice", codiceClasse)
        .single();
      if (error) throw new Error("Classe " + codiceClasse + " non trovata per l'anno attivo.");
      return data.id;
    }

    async function getIscrizioniClasse(classeAnnoId) {
      const { data, error } = await sb
        .from("iscrizioni")
        .select("id, stato, alunni(id, nome_cognome)")
        .eq("classe_anno_id", classeAnnoId)
        .eq("stato", "attivo");
      if (error) throw new Error(error.message);
      return (data || [])
        .filter(r => r.alunni)
        .sort((a, b) => a.alunni.nome_cognome.localeCompare(b.alunni.nome_cognome, "it"));
    }

    async function loadAlunni(selectClasseId, selectAlunnoId, statusId) {
      const cl = document.getElementById(selectClasseId).value;
      const sel = document.getElementById(selectAlunnoId);
      const st = document.getElementById(statusId);
      if (!cl) {
        sel.innerHTML = '<option value="">Scegli classe...</option>';
        return;
      }
      st.innerText = "⏳ Caricamento alunni...";
      try {
        const classeAnnoId = await getClasseAnnoId(cl);
        const iscr = await getIscrizioniClasse(classeAnnoId);
        sel.innerHTML = '<option value="">-- Seleziona alunno --</option>' +
          iscr.map(i => `<option value="${i.id}">${i.alunni.nome_cognome}</option>`).join("");
        st.innerText = "";
      } catch (e) {
        st.innerText = "❌ " + e.message;
      }
    }

    async function saveSingolo() {
      const btn = document.getElementById("s-btn");
      const st = document.getElementById("s-status");
      const cl = document.getElementById("s-classe").value;
      const iscrizioneId = document.getElementById("s-alunno").value;
      const materia = document.getElementById("s-materia").value;

      if (!cl || !iscrizioneId) {
        alert("Seleziona classe e alunno.");
        return;
      }

      let colonnaPayload;
      let regPayload = { iscrizione_id: iscrizioneId };

      const oggiIso = new Date().toISOString().slice(0, 10);
      const classeAnnoId = await getClasseAnnoId(cl);

      if (modoSingolo === "voto") {
        const voto = document.getElementById("s-voto").value.trim();
        if (!voto) { alert("Inserisci un voto."); return; }
        colonnaPayload = {
          classe_anno_id: classeAnnoId,
          data_evento: oggiIso,
          tipo: "verifica",
          materia: materia,
          verso_annotazione: null,
          descrizione_negativa: null
        };
        regPayload.voto = voto;
        regPayload.annotazione_punti = null;
      } else {
        const punti = Number(document.getElementById("s-ann-punti").value);
        const verso = punti > 0 ? "pos" : "neg";
        const desc = document.getElementById("s-desc-neg").value.trim();
        if (verso === "neg" && !desc) {
          alert("Inserisci la descrizione per l'annotazione negativa.");
          return;
        }
        colonnaPayload = {
          classe_anno_id: classeAnnoId,
          data_evento: oggiIso,
          tipo: "annotazione",
          materia: null,
          verso_annotazione: verso,
          descrizione_negativa: verso === "neg" ? desc : null
        };
        regPayload.voto = null;
        regPayload.annotazione_punti = punti;
      }

      btn.disabled = true;
      st.innerText = "⏳ Salvataggio...";
      try {
        const { data: col, error: colErr } = await sb
          .from("colonne_evento")
          .insert(colonnaPayload)
          .select("id")
          .single();
        if (colErr) throw new Error(colErr.message);

        regPayload.colonna_id = col.id;
        const { error: regErr } = await sb.from("registrazioni").insert(regPayload);
        if (regErr) throw new Error(regErr.message);

        st.innerText = "✅ Registrato!";
        document.getElementById("s-voto").value = "";
        document.getElementById("s-desc-neg").value = "";
      } catch (e) {
        st.innerText = "❌ Errore: " + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function loadVerificaGrid() {
      const cl = document.getElementById("v-classe").value;
      const wrap = document.getElementById("v-grid-wrap");
      const btn = document.getElementById("v-btn");
      const st = document.getElementById("v-status");

      if (!cl) {
        wrap.classList.add("hidden");
        btn.classList.add("hidden");
        return;
      }

      st.innerText = "⏳ Caricamento griglia...";
      try {
        const classeAnnoId = await getClasseAnnoId(cl);
        const iscr = await getIscrizioniClasse(classeAnnoId);
        document.getElementById("v-tbody").innerHTML = iscr.map(i => `
          <tr data-isc-id="${i.id}">
            <td><strong>${i.alunni.nome_cognome}</strong></td>
            <td><input type="text" class="cell-inp v-voto" placeholder="Es: 7+"></td>
            <td>
              <select class="cell-inp v-ann">
                <option value="">--</option>
                <option value="0.25">+0.25</option>
                <option value="-0.25">-0.25</option>
              </select>
            </td>
            <td><input type="text" class="cell-inp v-desc" placeholder="Solo se -0.25"></td>
          </tr>
        `).join("");
        wrap.classList.remove("hidden");
        btn.classList.remove("hidden");
        st.innerText = "";
      } catch (e) {
        st.innerText = "❌ " + e.message;
      }
    }

    async function saveVerificaGrid() {
      const cl = document.getElementById("v-classe").value;
      const dataEvento = document.getElementById("v-data").value;
      const materia = document.getElementById("v-materia").value;
      const argomento = document.getElementById("v-argomento").value.trim() || null;
      const st = document.getElementById("v-status");
      const btn = document.getElementById("v-btn");

      if (!cl || !dataEvento) {
        alert("Seleziona classe e data.");
        return;
      }

      const rows = Array.from(document.querySelectorAll("#v-tbody tr"));
      const daSalvare = [];

      for (const tr of rows) {
        const iscId = tr.getAttribute("data-isc-id");
        const voto = tr.querySelector(".v-voto").value.trim();
        const annStr = tr.querySelector(".v-ann").value;
        const desc = tr.querySelector(".v-desc").value.trim();

        if (!voto && !annStr) continue;
        if (voto && annStr) {
          alert("Per ogni alunno inserisci o il voto oppure l'annotazione (±0.25), non entrambi.");
          return;
        }
        if (annStr === "-0.25" && !desc) {
          alert("Inserisci la descrizione per l'annotazione -0.25.");
          return;
        }

        daSalvare.push({
          iscrizione_id: iscId,
          voto: voto || null,
          annotazione_punti: annStr ? Number(annStr) : null,
          desc: desc || null
        });
      }

      if (daSalvare.length === 0) {
        alert("Compila almeno una riga della griglia.");
        return;
      }

      btn.disabled = true;
      st.innerText = "⏳ Salvataggio verifica...";
      try {
        const classeAnnoId = await getClasseAnnoId(cl);
        const { data: colVer, error: errVer } = await sb
          .from("colonne_evento")
          .insert({
            classe_anno_id: classeAnnoId,
            data_evento: dataEvento,
            tipo: "verifica",
            materia: materia,
            argomento: argomento,
            verso_annotazione: null,
            descrizione_negativa: null
          })
          .select("id")
          .single();
        if (errVer) throw new Error(errVer.message);

        const regs = [];
        for (const item of daSalvare) {
          if (item.voto) {
            regs.push({
              iscrizione_id: item.iscrizione_id,
              colonna_id: colVer.id,
              voto: item.voto,
              annotazione_punti: null
            });
          } else {
            const verso = item.annotazione_punti > 0 ? "pos" : "neg";
            const { data: colAnn, error: errAnn } = await sb
              .from("colonne_evento")
              .insert({
                classe_anno_id: classeAnnoId,
                data_evento: dataEvento,
                tipo: "annotazione",
                materia: null,
                argomento: null,
                verso_annotazione: verso,
                descrizione_negativa: verso === "neg" ? item.desc : ""
              })
              .select("id")
              .single();
            if (errAnn) throw new Error(errAnn.message);

            regs.push({
              iscrizione_id: item.iscrizione_id,
              colonna_id: colAnn.id,
              voto: null,
              annotazione_punti: item.annotazione_punti
            });
          }
        }

        const { error: regErr } = await sb.from("registrazioni").insert(regs);
        if (regErr) throw new Error(regErr.message);

        st.innerText = `✅ Salvati ${regs.length} inserimenti per ${cl}.`;
        document.querySelectorAll(".v-voto, .v-desc").forEach(i => i.value = "");
        document.querySelectorAll(".v-ann").forEach(s => s.value = "");
      } catch (e) {
        st.innerText = "❌ Errore: " + e.message;
      } finally {
        btn.disabled = false;
      }
    }

    function formatDataShort(isoDate) {
      if (!isoDate) return "";
      const [y, m, d] = isoDate.split("-");
      return `${d}/${m}`;
    }

    async function loadProspetto() {
      const cl = document.getElementById("p-classe").value;
      const wrap = document.getElementById("p-wrap");
      const table = document.getElementById("p-table");
      const st = document.getElementById("p-status");

      if (!cl) {
        wrap.classList.add("hidden");
        st.innerText = "";
        return;
      }

      st.innerText = "⏳ Caricamento prospetto " + cl + "...";
      try {
        const classeAnnoId = await getClasseAnnoId(cl);
        const iscr = await getIscrizioniClasse(classeAnnoId);

        const { data: cols, error: colErr } = await sb
          .from("colonne_evento")
          .select("id, data_evento, tipo, materia, verso_annotazione, descrizione_negativa, creato_il")
          .eq("classe_anno_id", classeAnnoId)
          .order("data_evento", { ascending: true })
          .order("creato_il", { ascending: true });
        if (colErr) throw new Error(colErr.message);

        const colIds = (cols || []).map(c => c.id);
        let regs = [];
        if (colIds.length > 0) {
          const { data: regData, error: regErr } = await sb
            .from("registrazioni")
            .select("iscrizione_id, colonna_id, voto, annotazione_punti")
            .in("colonna_id", colIds);
          if (regErr) throw new Error(regErr.message);
          regs = regData || [];
        }

        const mapReg = new Map();
        for (const r of regs) {
          mapReg.set(`${r.iscrizione_id}__${r.colonna_id}`, r);
        }

        const thead = "<thead><tr><th>Alunno</th>" +
          (cols || []).map(c => `<th>${formatDataShort(c.data_evento)}</th>`).join("") +
          "</tr></thead>";

        const bodyRows = iscr.map(i => {
          const cells = (cols || []).map(c => {
            const r = mapReg.get(`${i.id}__${c.id}`);
            if (!r) return "·";
            if (r.voto) return `<strong>${r.voto}</strong>`;
            if (r.annotazione_punti !== null) {
              const cls = r.annotazione_punti > 0 ? "color:var(--pos);" : "color:var(--neg);";
              const txt = r.annotazione_punti > 0 ? "+0.25" : "-0.25";
              return `<span style="${cls}font-weight:700;">${txt}</span>`;
            }
            return "·";
          }).join("");
          return `<tr><td><strong>${i.alunni.nome_cognome}</strong></td>${cells}</tr>`;
        }).join("");

        const footerCells = (cols || []).map(c => {
          if (c.tipo === "verifica") return c.materia || "";
          if (c.tipo === "annotazione" && c.verso_annotazione === "neg") {
            return c.descrizione_negativa || "";
          }
          return "";
        }).join("");

        const footerRow = `<tr class="footer-row"><td>Dettaglio</td>${footerCells}</tr>`;

        table.innerHTML = thead + "<tbody>" + bodyRows + footerRow + "</tbody>";
        wrap.classList.remove("hidden");
        st.innerText = "";
      } catch (e) {
        st.innerText = "❌ " + e.message;
        wrap.classList.add("hidden");
      }
    }
  </script>
